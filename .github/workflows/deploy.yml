name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}        # dc-monitors-github-deploy SP appId
  AZURE_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME:              dczendeskdispatcheracr
  IMAGE_NAME:            status-monitor
  WEB_APP:               dc-status-monitor-web
  CRON_JOB:              dc-status-monitor-cron
  WEB_RG:                dc-monitors-rg

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id:       ${{ env.AZURE_CLIENT_ID }}
          tenant-id:       ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --image "$IMAGE_NAME:latest" \
            .

      - name: Bind ACR registry to app + job (managed identity)
        run: |
          # The bootstrap deploy left the registries block empty (a registries
          # entry whose identity lacks AcrPull fails revision provisioning). By
          # first real push, AcrPull has been granted to both managed identities,
          # so bind the ACR now via the system-assigned identity. Must run BEFORE
          # the image update so the ACR image can be pulled. Idempotent.
          az containerapp registry set \
            --resource-group "$WEB_RG" \
            --name "$WEB_APP" \
            --server "$ACR_NAME.azurecr.io" \
            --identity system
          az containerapp job registry set \
            --resource-group "$WEB_RG" \
            --name "$CRON_JOB" \
            --server "$ACR_NAME.azurecr.io" \
            --identity system

      - name: Deploy web Container App
        run: |
          az containerapp update \
            --resource-group "$WEB_RG" \
            --name "$WEB_APP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"
          # Transition ingress from the placeholder port (80) to the production
          # uvicorn port (8000). Changing the image does NOT update ingress, so
          # this is required. Idempotent once already at 8000.
          az containerapp ingress update \
            --resource-group "$WEB_RG" \
            --name "$WEB_APP" \
            --type external \
            --target-port 8000

      - name: Deploy cron Container Apps Job
        run: |
          # The placeholder job has no command override (uses the placeholder
          # image entrypoint); set the production command here alongside the
          # real image. Idempotent once already set.
          az containerapp job update \
            --resource-group "$WEB_RG" \
            --name "$CRON_JOB" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" \
            --command "python" "-m" "cron.run"
